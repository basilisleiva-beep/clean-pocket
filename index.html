<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Clean Pocket</title>
<meta name="description" content="Clean Pocket: τι σου μένει καθαρά μετά τα έξοδα, ΕΦΚΑ, φόρο και ΦΠΑ.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#142b24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clean Pocket">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fira+Sans+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="boot-reveal">

<div id="app" class="app">

  <div class="banner" id="installBar" hidden>
    <span id="installText"></span>
    <button type="button" class="btn sm" id="installBtn"></button>
    <button type="button" class="btn sm ghost" id="installLater"></button>
  </div>
  <div class="banner" id="updateBar" hidden>
    <button type="button" class="btn sm wide" id="updateBtn"></button>
  </div>
  <div class="banner warn" id="backupBar" hidden>
    <span id="backupText"></span>
    <button type="button" class="btn sm" id="backupNowBtn"></button>
    <button type="button" class="btn sm ghost" id="backupLaterBtn"></button>
  </div>
  <div class="banner sample" id="sampleBar" hidden>
    <span id="sampleBarText"></span>
    <button type="button" class="btn sm ghost" id="sampleRemoveBtn"></button>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="toast" id="toast" hidden role="status"></div>

  <!-- ===== HOME ===== -->
  <section class="view" id="view-home" data-view="home">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 96 96" role="img" aria-label="Clean Pocket">
          <g transform="rotate(-8 48 26)">
            <rect class="k-note" x="20" y="6" width="56" height="36" rx="5"/>
            <rect class="k-noteline" x="25" y="11" width="46" height="26" rx="3" fill="none" stroke-width="1.5"/>
            <circle class="k-noteline" cx="48" cy="24" r="9" fill="none" stroke-width="1.5"/>
            <text class="k-notetext" x="48" y="29" text-anchor="middle" font-size="14" font-weight="800">&#8364;</text>
            <circle class="k-noteline" cx="30" cy="24" r="2.2" fill="none" stroke-width="1.2"/>
            <circle class="k-noteline" cx="66" cy="24" r="2.2" fill="none" stroke-width="1.2"/>
          </g>
          <path class="k-pocket" d="M12 40 H84 V68 Q84 74 79 77 L48 92 L17 77 Q12 74 12 68 Z"/>
          <path class="k-hem" d="M12 40 H84 V49 H12 Z"/>
          <path class="k-stitch" d="M19 55 V67 Q19 70 22 72 L48 85 L74 72 Q77 70 77 67 V55" fill="none" stroke-width="1.6" stroke-dasharray="3.5 3"/>
        </svg>
        <h1>Clean Pocket</h1>
      </div>
      <div class="topbar-right">
        <span class="streak" id="streak" hidden></span>
        <div class="seg sm langseg" id="langSegTop" role="group" aria-label="Γλώσσα">
          <button type="button" class="segbtn" data-lang="el" aria-pressed="true">&Epsilon;&Lambda;</button>
          <button type="button" class="segbtn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <div class="picker seg" role="group" aria-label="Περίοδος" id="periodSeg">
      <button type="button" class="segbtn" data-period="h1" aria-pressed="true"></button>
      <button type="button" class="segbtn" data-period="h2" aria-pressed="false"></button>
      <button type="button" class="segbtn" data-period="month" aria-pressed="false"></button>
      <button type="button" class="segbtn" data-period="year" aria-pressed="false"></button>
    </div>
    <div class="periodNav">
      <button type="button" class="iconbtn" id="periodPrev" aria-label="‹">‹</button>
      <strong id="periodLabel"></strong>
      <button type="button" class="iconbtn" id="periodNext" aria-label="›">›</button>
    </div>

    <section class="card hero" id="heroCard" aria-live="polite">
      <p class="kicker" id="heroKicker"></p>
      <div class="big num" id="netBig">-</div>
      <p class="kicker" id="netSub"></p>
      <div class="tiles">
        <div class="tile"><span class="tkicker" id="tEarnedLbl"></span><span class="tval" id="tEarned">-</span><span class="tcap" id="tEarnedCap"></span></div>
        <div class="tile"><span class="tkicker" id="tYoursLbl"></span><span class="tval" id="tYours">-</span><span class="tcap" id="tYoursCap"></span></div>
        <div class="tile"><span class="tkicker" id="tSetAsideLbl"></span><span class="tval" id="tSetAside">-</span><span class="tcap" id="tSetAsideCap"></span></div>
      </div>
      <div class="hero-empty-actions" id="heroEmptyActions" hidden>
        <button type="button" class="btn" id="heroAddBtn"></button>
        <button type="button" class="btn ghost" id="heroSampleBtn"></button>
      </div>
    </section>

    <div class="explainer" id="firstShiftExplainer" hidden>
      <span id="explainerText"></span>
      <button type="button" class="x" id="explainerClose">&#10005;</button>
    </div>

    <section class="card" id="nextDueCard">
      <h2 id="h-nextdue"></h2>
      <ul class="obl-list" id="nextDueList"></ul>
    </section>

    <section class="card" id="goalMiniCard">
      <div class="goal-mini-head">
        <span id="goalMiniLabel"></span>
        <span id="goalMiniPct"></span>
      </div>
      <div class="goal-track sm"><div class="goal-fill" id="goalMiniFill"></div></div>
    </section>

    <section class="card" id="last7Card">
      <h2 id="h-last7"></h2>
      <div class="wk" id="wkBars"></div>
      <p class="note" id="wkNote"></p>
    </section>

    <details class="card" id="breakdownCard">
      <summary id="h-breakdown"></summary>
      <div class="laneWrap">
        <span class="rider" id="rider" aria-hidden="true" hidden>&#128692;</span>
        <div class="lane" id="lane" role="img"></div>
      </div>
      <ul class="legend" id="legendList"></ul>
      <div class="rates">
        <div class="rate"><div class="num" id="totHours">-</div><div class="kicker" id="lblTotHours"></div></div>
        <div class="rate"><div class="num" id="perHour">-</div><div class="kicker" id="lblPerHour"></div></div>
        <div class="rate"><div class="num" id="perShift">-</div><div class="kicker" id="lblPerShift"></div></div>
      </div>
      <p class="note" id="vatLine" hidden></p>
      <p class="note" id="prepayNote"></p>
      <p class="note warn" id="presumedWarn" hidden></p>
      <div class="field" id="extraWrap" hidden>
        <label for="extraInput" id="extraLabel"></label>
        <input type="text" id="extraInput" inputmode="decimal">
      </div>
    </details>
  </section>

  <!-- ===== CALENDAR ===== -->
  <section class="view" id="view-calendar" data-view="calendar" hidden>
    <header class="topbar"><h1 id="h-cal-title-top"></h1></header>
    <div class="card">
      <div class="cal-head">
        <button type="button" class="iconbtn" id="calPrev">&#8249;</button>
        <strong id="calTitle"></strong>
        <button type="button" class="iconbtn" id="calNext">&#8250;</button>
      </div>
      <div class="empty-inline" id="calEmpty" hidden>
        <p class="note" id="calEmptyText"></p>
        <button type="button" class="btn sm" id="calEmptyAddBtn"></button>
      </div>
      <div class="cal-dow" id="calDow" aria-hidden="true"></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span><i class="lg done"></i><span id="lgDone"></span></span>
        <span><i class="lg missing"></i><span id="lgMissing"></span></span>
        <span><i class="lg off"></i><span id="lgOff"></span></span>
        <span><i class="lg vat"></i><span id="lgVat"></span></span>
      </div>
    </div>
  </section>

  <!-- ===== OBLIGATIONS & GOALS ===== -->
  <section class="view" id="view-obligations" data-view="obligations" hidden>
    <header class="topbar"><h1 id="h-obl-top"></h1></header>

    <section class="card">
      <h2 id="h-obl"></h2>
      <p class="note" id="setAsideNote"></p>
      <div class="setaside-total"><span id="h-setaside"></span> <strong id="setAsideBig">-</strong></div>
      <ul class="obl-list" id="oblList"></ul>
      <button type="button" class="btn sm ghost" id="oblEmptyAddBtn" hidden></button>
      <details class="subcard">
        <summary id="h-add-debt"></summary>
        <div class="field"><label id="lblDebtName" for="debtName"></label><input type="text" id="debtName" maxlength="60"></div>
        <div class="field"><label id="lblDebtAmount" for="debtAmount"></label><input type="text" id="debtAmount" inputmode="decimal"></div>
        <div class="field"><label id="lblDebtDue" for="debtDue"></label><input type="date" id="debtDue"></div>
        <div class="field">
          <label id="lblDebtRepeat" for="debtRepeat"></label>
          <select id="debtRepeat"><option value="none" id="optRepeatNone"></option><option value="monthly" id="optRepeatMonthly"></option></select>
        </div>
        <button type="button" class="btn wide" id="debtAdd"></button>
      </details>
    </section>

    <section class="card goal" id="goalPanel">
      <div class="goal-top">
        <h2 id="goalTitleText"></h2>
      </div>
      <div class="goal-edit">
        <input type="text" id="goalInput" inputmode="numeric">
        <button type="button" class="btn" id="goalSave"></button>
        <button type="button" class="btn ghost goal-lock" id="goalLock" hidden aria-pressed="false">&#128275;</button>
      </div>
      <div class="goal-track" id="goalTrack">
        <div class="goal-fill" id="goalFill"></div>
        <span class="goal-rider" id="goalRider" aria-hidden="true">&#128692;</span>
        <span class="goal-flag" aria-hidden="true">&#127937;</span>
      </div>
      <p class="goal-line" id="goalLine"></p>
      <p class="goal-cheer" id="goalCheer"></p>
      <div class="goal-plan" id="goalPlan" hidden></div>
    </section>

    <section class="card">
      <h2 id="h-savings"></h2>
      <ul class="savings-list" id="savingsList"></ul>
      <details class="subcard">
        <summary id="h-add-savings"></summary>
        <div class="field"><label id="lblSavName" for="savName"></label><input type="text" id="savName" maxlength="60"></div>
        <div class="field"><label id="lblSavTarget" for="savTarget"></label><input type="text" id="savTarget" inputmode="decimal"></div>
        <div class="field"><label id="lblSavSaved" for="savSaved"></label><input type="text" id="savSaved" inputmode="decimal"></div>
        <div class="field"><label id="lblSavDate" for="savDate"></label><input type="date" id="savDate"></div>
        <button type="button" class="btn wide" id="savAdd"></button>
      </details>
    </section>
  </section>

  <!-- ===== MORE ===== -->
  <section class="view" id="view-more" data-view="more" hidden>
    <header class="topbar"><h1 id="h-more-top"></h1></header>

    <details class="card">
      <summary id="h-mydata"></summary>
      <div class="actions">
        <button type="button" class="btn" id="expJson"></button>
        <button type="button" class="btn ghost" id="expCsv"></button>
        <button type="button" class="btn ghost" id="shareBtn" hidden></button>
      </div>
      <div class="actions">
        <label class="btn ghost filebtn" for="impFile" id="lblImport"></label>
        <input type="file" id="impFile" class="sr" accept=".json,application/json,.csv,text/csv">
      </div>
      <div class="actions">
        <button type="button" class="btn ghost wide" id="shareAppBtn"></button>
      </div>
      <p class="note" id="lastBackupNote"></p>
      <p class="status" id="dataStatus" role="status"></p>
      <details class="subcard danger">
        <summary id="h-delete-all"></summary>
        <div class="field"><label id="lblDeleteConfirm" for="deleteConfirm"></label><input type="text" id="deleteConfirm"></div>
        <button type="button" class="btn danger wide" id="deleteAllBtn" disabled></button>
      </details>
    </details>

    <details class="card" id="fixedPanel">
      <summary><span id="h-fixed"></span> &middot; <span id="fixedTotal">0,00 &euro;</span></summary>
      <p class="note" id="fixedNote"></p>
      <ul class="fixedlist" id="fixedList"></ul>
      <div class="field"><label id="lblFxName" for="fxName"></label><input type="text" id="fxName" maxlength="60"></div>
      <div class="field"><label id="lblFxAmount" for="fxAmount"></label><input type="text" id="fxAmount" inputmode="decimal"></div>
      <label class="check"><input type="checkbox" id="fxVat"> <span id="lblFxVat"></span></label>
      <button type="button" class="btn wide" id="fxAdd"></button>
    </details>

    <details class="card">
      <summary id="h-history"></summary>
      <div id="histEmpty" class="note"></div>
      <div class="tablewrap" id="histWrap" hidden>
        <table>
          <thead><tr><th id="thMonth"></th><th class="r" id="thIncome"></th><th class="r" id="thTips"></th><th class="r" id="thNet"></th><th class="r" id="thShifts"></th></tr></thead>
          <tbody id="histBody"></tbody>
        </table>
      </div>
    </details>

    <details class="card">
      <summary id="h-pie"></summary>
      <div class="statbody">
        <div id="pieWrap"></div>
        <ul class="legend" id="pieLegend"></ul>
      </div>
      <p class="note" id="pieNote"></p>
    </details>

    <details class="card" id="settingsPanel">
      <summary id="h-settings"></summary>
      <div class="field">
        <label id="lblTheme"></label>
        <div class="theme-pick" id="themePick" role="group">
          <button type="button" data-theme="forest" aria-label="forest" aria-pressed="true"></button>
          <button type="button" data-theme="graphite" aria-label="graphite" aria-pressed="false"></button>
          <button type="button" data-theme="black" aria-label="black" aria-pressed="false"></button>
          <button type="button" data-theme="light" aria-label="light" aria-pressed="false"></button>
        </div>
      </div>
      <div class="field">
        <label id="lblLang"></label>
        <div class="seg" id="langSeg">
          <button type="button" class="segbtn" data-lang="el" aria-pressed="true">&Epsilon;&Lambda;</button>
          <button type="button" class="segbtn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <div class="field">
        <label id="lblWeather"></label>
        <select id="weatherMode">
          <option value="off" id="optWxOff"></option>
          <option value="city" id="optWxCity"></option>
          <option value="geo" id="optWxGeo"></option>
        </select>
      </div>
      <div class="field" id="weatherCityWrap" hidden>
        <label id="lblWeatherCity" for="weatherCity"></label>
        <select id="weatherCity"></select>
      </div>
      <div id="wxDisplay" class="wx" hidden>
        <span class="wx-icon" id="wxIcon" aria-hidden="true">&#127780;&#65039;</span>
        <span class="wx-temp" id="wxTemp"></span>
        <span class="wx-label" id="wxLabel"></span>
      </div>
      <button type="button" class="btn ghost wide" id="reonboardBtn"></button>
      <button type="button" class="btn ghost wide" id="tourBtn"></button>
    </details>

    <details class="card">
      <summary id="h-about"></summary>
      <p class="note" id="aboutSource"></p>
      <p class="note" id="aboutDisclaimer"></p>
    </details>
  </section>

  <!-- ===== NEW SHIFT SHEET ===== -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="shiftSheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grab"></div>
    <h2 id="sheetTitle"></h2>
    <div class="field"><label id="lblDate" for="fDate"></label><input type="date" id="fDate"></div>
    <div class="field"><label id="lblIncome" for="fIncome"></label><input type="text" id="fIncome" inputmode="decimal"></div>
    <div class="field">
      <label id="lblTips" for="fTips"></label>
      <input type="text" id="fTips" inputmode="decimal">
      <div class="chips" role="group">
        <button type="button" class="chip" data-add="1">+1</button>
        <button type="button" class="chip" data-add="2">+2</button>
        <button type="button" class="chip" data-add="5">+5</button>
        <button type="button" class="chip" data-add="10">+10</button>
        <button type="button" class="chip clear" id="tipsClear">&#10005;</button>
      </div>
    </div>
    <div class="field"><label id="lblHours" for="fHours"></label><input type="text" id="fHours" inputmode="decimal"></div>
    <div class="field"><label id="lblExp" for="fExp"></label><input type="text" id="fExp" inputmode="decimal"></div>
    <label class="check"><input type="checkbox" id="fOff"> <span id="lblDayOff"></span></label>
    <p class="status" id="sheetStatus" role="status"></p>
    <div class="sheet-actions">
      <button type="button" class="btn wide" id="sheetSave"></button>
      <button type="button" class="btn ghost wide" id="sheetDelete" hidden></button>
      <button type="button" class="btn ghost wide" id="sheetCancel"></button>
    </div>
  </div>

  <!-- ===== CSV IMPORT PREVIEW ===== -->
  <div class="sheet-backdrop" id="csvBackdrop" hidden></div>
  <div class="sheet" id="csvSheet" hidden role="dialog" aria-modal="true" aria-labelledby="csvTitle">
    <h2 id="csvTitle"></h2>
    <p class="note" id="csvFound"></p>
    <p class="note" id="csvSkipped"></p>
    <div class="tablewrap"><table><tbody id="csvPreviewBody"></tbody></table></div>
    <div class="sheet-actions">
      <button type="button" class="btn wide" id="csvConfirm"></button>
      <button type="button" class="btn ghost wide" id="csvCancel"></button>
    </div>
  </div>

  <!-- ===== ONBOARDING ===== -->
  <div class="onb-backdrop" id="onbBackdrop" hidden>
    <div class="onb" id="onb" role="dialog" aria-modal="true" aria-labelledby="onbTitle">
      <div class="onb-steps" id="onbSteps"></div>
      <h2 id="onbTitle"></h2>
      <div id="onbBody"></div>
      <div class="onb-actions">
        <button type="button" class="btn ghost" id="onbSkip"></button>
        <div class="onb-actions-right">
          <button type="button" class="btn ghost" id="onbBack" hidden></button>
          <button type="button" class="btn" id="onbNext"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== TOUR PROMPT ===== -->
  <div class="onb-backdrop" id="tourPromptBackdrop" hidden>
    <div class="onb" id="tourPrompt" role="dialog" aria-modal="true" aria-labelledby="tourPromptTitle">
      <h2 id="tourPromptTitle"></h2>
      <div class="tourprompt-actions">
        <button type="button" class="btn wide" id="tourPromptYes"></button>
        <button type="button" class="btn ghost wide" id="tourPromptSampleBtn"></button>
        <button type="button" class="btn ghost wide" id="tourPromptNo"></button>
      </div>
    </div>
  </div>

  <!-- ===== GUIDED TOUR ===== -->
  <div class="tour-backdrop" id="tourBackdrop" hidden>
    <div class="tour-spot" id="tourSpot"></div>
    <div class="tour-card" id="tourCard" role="dialog" aria-modal="true" aria-labelledby="tourTitle" aria-describedby="tourDesc" tabindex="-1">
      <p class="tour-counter" id="tourCounter" aria-live="polite"></p>
      <h3 id="tourTitle"></h3>
      <p id="tourDesc"></p>
      <div class="tour-actions">
        <button type="button" class="btn ghost sm" id="tourSkip"></button>
        <div class="tour-actions-right">
          <button type="button" class="btn ghost sm" id="tourBack" hidden></button>
          <button type="button" class="btn sm" id="tourNext"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottomnav" id="bottomnav" aria-label="Πλοήγηση">
    <button type="button" class="navbtn" data-nav="home" aria-current="page">
      <span class="navicon">&#127968;</span><span class="navlabel" id="navHomeLbl"></span>
    </button>
    <button type="button" class="navbtn" data-nav="calendar">
      <span class="navicon">&#128197;</span><span class="navlabel" id="navCalLbl"></span>
    </button>
    <button type="button" class="navbtn navplus" id="navAddBtn" aria-label="Νέα βάρδια">
      <span class="navplus-icon">+</span>
    </button>
    <button type="button" class="navbtn" data-nav="obligations">
      <span class="navicon">&#128179;</span><span class="navlabel" id="navOblLbl"></span>
    </button>
    <button type="button" class="navbtn" data-nav="more">
      <span class="navicon">&#8942;</span><span class="navlabel" id="navMoreLbl"></span>
    </button>
  </nav>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
